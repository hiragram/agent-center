name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout Agent Center
        uses: actions/checkout@v4
        with:
          path: agent-center

      - name: Checkout TypeScript SDK
        uses: actions/checkout@v4
        with:
          repository: hiragram/event-emission-protocol-ts
          path: event-emission-protocol-ts

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: agent-center/package-lock.json

      - name: Install dependencies
        working-directory: agent-center
        run: npm ci

      - name: Build
        working-directory: agent-center
        run: npm run build

      - name: Test
        working-directory: agent-center
        run: npm test
